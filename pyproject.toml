[tool.poetry]
name = "space-ska"
version = "2.2"
description = "Spectral-Kit for Asteroids"
authors = ["Benoit Carry <benoit.carry@oca.eu>", "Max Mahlke"]
license = "MIT"
readme = "README.md"
packages = [{'include' = 'ska'}]

[tool.poetry.dependencies]
python = "^3.11"
requests = "^2.32.0"
pandas = "^3.0"
click = "^8.3"
rich = "^14"
astropy = "^7.1"
numpy = "^2.0"
matplotlib = "^3.10"
furo = "^2025.12.19"
sphinx-copybutton = "^0.5.0"
sphinx_design = "^0.7.0"
sphinx-hoverxref = "^1.4"

[tool.poetry.extras]
docs = [
  "furo",
  "sphinx",
  "sphinx-copybutton",
  "sphinx-hoverxref",
  "sphinx-redactor-theme",
  "spinx_design"
]

[tool.poetry.scripts]
ska = "ska.cli:cli_ska"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
